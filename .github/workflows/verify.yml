name: Verify KMP client
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6
      - name: Install compile SDK
        shell: pwsh
        run: |
          $sdk = (Select-String '^androidSdkPlatform = "([0-9.]+)"' gradle/libs.versions.toml).Matches[0].Groups[1].Value
          sdkmanager "platforms;android-$sdk"
          if ($LASTEXITCODE -ne 0) { throw "SDK installation failed" }
      - name: Verify Android builds, client tests and lint (no private contract)
        shell: pwsh
        run: ./ci/check-android.ps1 -SkipContractTests
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6
      - name: Verify host and toolchains
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun simctl list devices available
      - name: Install compile SDK
        run: |
          sdk=$(sed -n 's/^androidSdkPlatform = "\([0-9.]*\)"/\1/p' gradle/libs.versions.toml)
          test -n "$sdk"
          sdkmanager "platforms;android-$sdk"
      - name: Verify native tests and unsigned Xcode builds
        run: sh ci/check-ios.sh
